# Run the whole site locally or on a single server:
#   cp .env.example .env   (then edit SECRET_KEY)
#   docker compose up --build
# Open http://localhost:8080

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fomoshi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fomoshi}
      POSTGRES_DB: fomoshi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fomoshi"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://fomoshi:${POSTGRES_PASSWORD:-fomoshi}@db:5432/fomoshi
      REDIS_URL: redis://redis:6379/0
      RUN_WORKER_IN_PROCESS: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy  # the API has applied migrations by then

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  pgdata:
