[project]
name = "fomoshi-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Depends() in default args is idiomatic

[tool.ruff.lint.per-file-ignores]
"scripts/make_fixtures.py" = ["E501"]  # long sample-data strings
